name: talkative_todo
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  permission_handler: ^12.0.1
  path_provider: ^2.1.1
  google_fonts: ^8.0.0
  uuid: ^4.5.2
  lucide_icons: ^0.257.0
  share_plus: ^12.0.1
  file_picker: ^10.3.10
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  firebase_database: ^12.1.2
  google_sign_in: ^6.3.0
  connectivity_plus: ^6.0.5
  table_calendar: ^3.2.0
  drag_and_drop_lists: ^0.4.2
  speech_to_text: ^7.0.0
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
